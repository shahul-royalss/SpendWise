<nav class="sw-month-nav" aria-label="Choose month">
  <a class="btn btn-sm" href="{{ base_url }}?month={{ previous_month|date:'Y-m' }}" aria-label="Previous month">
    <i class="bi bi-chevron-left" aria-hidden="true"></i>
  </a>
  <span class="sw-month-label">{{ month|date:"F Y" }}</span>
  <a class="btn btn-sm" href="{{ base_url }}?month={{ next_month|date:'Y-m' }}" aria-label="Next month">
    <i class="bi bi-chevron-right" aria-hidden="true"></i>
  </a>
  {% if not is_current_month %}
    <a class="btn btn-sm fw-semibold" href="{{ base_url }}">Today</a>
  {% endif %}
</nav>
