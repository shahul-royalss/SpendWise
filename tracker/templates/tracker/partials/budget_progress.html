{% if row.has_budget %}
  <div class="d-flex align-items-center gap-2">
    <div class="progress flex-grow-1" role="progressbar" aria-label="{{ row.category.name }} budget used"
         aria-valuenow="{{ row.progress }}" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-bar bg-{{ row.alert_level.css_class }}" style="width: {{ row.progress }}%"></div>
    </div>
    <span class="small fw-semibold tabular text-{{ row.alert_level.css_class }}-emphasis">{{ row.percentage }}%</span>
  </div>
{% else %}
  <span class="small text-body-secondary">No budget set</span>
{% endif %}
