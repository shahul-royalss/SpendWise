{% extends "base.html" %}

{% block title %}Log out{% endblock %}
{% block fab %}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8 col-lg-6 col-xl-5">
    <div class="card sw-fade-up">
      <div class="card-body p-4 p-lg-5 text-center">
        <div class="sw-empty-icon"><i class="bi bi-box-arrow-right" aria-hidden="true"></i></div>
        <h1 class="h4 fw-bold mb-2">Log out of SpendWise?</h1>
        <p class="text-body-secondary mb-4">You can log back in at any time.</p>
        <form method="post" class="d-flex gap-2 justify-content-center">
          {% csrf_token %}
          <button type="submit" class="btn btn-primary btn-lg">Log out</button>
          <a class="btn btn-outline-secondary btn-lg" href="{% url 'tracker:dashboard' %}">Stay logged in</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
