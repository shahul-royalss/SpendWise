{% extends "base.html" %}

{% block title %}Form expired{% endblock %}

{% block content %}
<div class="text-center py-5 sw-fade-up">
  <div class="sw-empty-icon"><i class="bi bi-arrow-clockwise" aria-hidden="true"></i></div>
  <h1 class="h3 sw-title">This form has expired</h1>
  <p class="text-body-secondary mb-4">For your security the request was blocked. Go back, reload the page and try again.</p>
  <a class="btn btn-primary btn-lg" href="{% url 'tracker:dashboard' %}"><i class="bi bi-house me-1" aria-hidden="true"></i>Back to the dashboard</a>
</div>
{% endblock %}
