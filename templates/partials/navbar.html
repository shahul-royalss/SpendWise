{% with url_name=request.resolver_match.url_name %}
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{% url 'tracker:dashboard' %}">
      <i class="bi bi-wallet2 me-1" aria-hidden="true"></i>SpendWise
    </a>
    {% if user.is_authenticated %}
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#main-nav"
              aria-controls="main-nav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="main-nav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link{% if url_name == 'dashboard' %} active{% endif %}"{% if url_name == 'dashboard' %} aria-current="page"{% endif %} href="{% url 'tracker:dashboard' %}">
              <i class="bi bi-speedometer2 me-1" aria-hidden="true"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if 'expense_' in url_name %} active{% endif %}"{% if 'expense_' in url_name %} aria-current="page"{% endif %} href="{% url 'tracker:expense_list' %}">
              <i class="bi bi-receipt me-1" aria-hidden="true"></i>Expenses
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if 'budget_' in url_name %} active{% endif %}"{% if 'budget_' in url_name %} aria-current="page"{% endif %} href="{% url 'tracker:budget_list' %}">
              <i class="bi bi-piggy-bank me-1" aria-hidden="true"></i>Budgets
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link{% if 'category_' in url_name %} active{% endif %}"{% if 'category_' in url_name %} aria-current="page"{% endif %} href="{% url 'tracker:category_list' %}">
              <i class="bi bi-tags me-1" aria-hidden="true"></i>Categories
            </a>
          </li>
        </ul>
        <div class="d-flex flex-wrap align-items-center gap-2">
          <a class="btn btn-light btn-sm fw-semibold" href="{% url 'tracker:expense_create' %}">
            <i class="bi bi-plus-lg me-1" aria-hidden="true"></i>Add expense
          </a>
          <div class="dropdown">
            <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle me-1" aria-hidden="true"></i>{{ user.get_username }}
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
              <li>
                <form method="post" action="{% url 'accounts:logout' %}">
                  {% csrf_token %}
                  <button type="submit" class="dropdown-item">
                    <i class="bi bi-box-arrow-right me-2" aria-hidden="true"></i>Log out
                  </button>
                </form>
              </li>
            </ul>
          </div>
        </div>
      </div>
    {% else %}
      <div class="ms-auto d-flex gap-2">
        <a class="btn btn-outline-light btn-sm" href="{% url 'accounts:login' %}">Log in</a>
        <a class="btn btn-light btn-sm" href="{% url 'accounts:register' %}">Register</a>
      </div>
    {% endif %}
  </div>
</nav>
{% endwith %}
