{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3 sw-toasts" aria-live="polite">
  {% for message in messages %}
    {% with level=message.level_tag|default:"info" %}
      <div class="toast fade show sw-toast text-{{ level }}-emphasis"
           role="{% if level == 'danger' or level == 'warning' %}alert{% else %}status{% endif %}"
           data-autohide="{% if level == 'danger' or level == 'warning' %}12000{% else %}6000{% endif %}"
           style="--i: {{ forloop.counter0 }}; --sw-toast-delay: {% if level == 'danger' or level == 'warning' %}12s{% else %}6s{% endif %};">
        <div class="d-flex align-items-start gap-3 p-3">
          <span class="sw-icon-bubble sw-icon-bubble-sm sw-tone-{{ level }}">
            <i class="bi bi-{% if level == 'success' %}check-lg{% elif level == 'danger' %}x-octagon-fill{% elif level == 'warning' %}exclamation-triangle-fill{% else %}info-lg{% endif %}" aria-hidden="true"></i>
          </span>
          <div class="flex-grow-1 small text-body pt-1">{{ message }}</div>
          <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
        </div>
        <div class="sw-toast-timer"></div>
      </div>
    {% endwith %}
  {% endfor %}
</div>
{% endif %}
